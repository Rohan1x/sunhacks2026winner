[package]
name = "rulecash"
version = "0.1.0"
description = "RuleCash: USDC-style grant tokens enforced by a Token-2022 transfer hook"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rulecash"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["interface-instructions"] }
anchor-spl = { version = "0.31.1", features = ["token_2022", "token_2022_extensions"] }
spl-token-2022 = "6.0.0"
spl-tlv-account-resolution = "0.9.0"
spl-transfer-hook-interface = "0.9.0"
